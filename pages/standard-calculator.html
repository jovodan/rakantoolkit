<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الحاسبة العادية - RaKaNToolKit</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/rtl.css">
  <link rel="stylesheet" href="../css/calculators.css">
</head>
<body>

  <header class="header">
    <div class="container">
      <a href="../index.html" class="logo">RaKaNToolKit</a>
      <nav class="nav-links">
        <a href="../index.html" data-i18n="nav_home">الرئيسية</a>
        <a href="../index.html#services" data-i18n="nav_services">الخدمات</a>
      </nav>
      <div class="header-actions">
        <div class="lang-selector">
          <button class="lang-btn">
            <span class="lang-current-label">العربية</span>
            <span>&#9662;</span>
          </button>
          <div class="lang-dropdown">
            <button data-lang="ar">العربية</button>
            <button data-lang="en">English</button>
            <button data-lang="fr">Français</button>
          </div>
        </div>
        <button class="btn-icon theme-toggle" title="Toggle theme">&#127769;</button>
        <button class="mobile-menu-btn" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="calc-page">
    <div class="calc-container">
      <a href="../index.html" class="back-link" data-i18n="calc_back">&#8592; العودة للرئيسية</a>
      <div class="calc-wrapper">
        <div class="calc-display">
          <div class="calc-expression" id="expression"></div>
          <div class="calc-result" id="result">0</div>
        </div>
        <div class="calc-buttons">
          <button class="calc-btn clear" data-action="clear">AC</button>
          <button class="calc-btn fn" data-action="sign">&plusmn;</button>
          <button class="calc-btn fn" data-action="percent">%</button>
          <button class="calc-btn operator" data-action="operator" data-value="/">&divide;</button>

          <button class="calc-btn" data-action="number" data-value="7">7</button>
          <button class="calc-btn" data-action="number" data-value="8">8</button>
          <button class="calc-btn" data-action="number" data-value="9">9</button>
          <button class="calc-btn operator" data-action="operator" data-value="*">&times;</button>

          <button class="calc-btn" data-action="number" data-value="4">4</button>
          <button class="calc-btn" data-action="number" data-value="5">5</button>
          <button class="calc-btn" data-action="number" data-value="6">6</button>
          <button class="calc-btn operator" data-action="operator" data-value="-">&minus;</button>

          <button class="calc-btn" data-action="number" data-value="1">1</button>
          <button class="calc-btn" data-action="number" data-value="2">2</button>
          <button class="calc-btn" data-action="number" data-value="3">3</button>
          <button class="calc-btn operator" data-action="operator" data-value="+">+</button>

          <button class="calc-btn span-2" data-action="number" data-value="0">0</button>
          <button class="calc-btn" data-action="decimal">.</button>
          <button class="calc-btn equals" data-action="equals">=</button>
        </div>
        <div class="calc-history" id="history">
          <h4 data-i18n="calc_history">السجل</h4>
          <div id="historyList"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/calculators/standard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | ركان تول كيت</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="main-header">
    <div class="container header-layout">
      <a href="../index.html" class="logo">
        <span class="logo-icon">&#128296;</span>
        <span class="logo-text">ركان<span class="logo-highlight">تول كيت</span></span>
      </a>
      <nav class="main-nav" id="mainNav">
        <a href="../index.html">&#127968; الرئيسية</a>
        <a href="store.html">&#128722; المتجر</a>
        <a href="admin.html" class="active">&#128736; لوحة التحكم</a>
      </nav>
      <div class="header-actions">
        <button class="lang-toggle" id="langToggle">&#127760;</button>
        <button class="theme-toggle" id="themeToggle">&#9790;</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <div class="container">

      <!-- TOP STATS -->
      <div class="admin-top-stats">
        <div class="top-stat-card top-stat-total">
          <div class="top-stat-icon">&#128230;</div>
          <div class="top-stat-info">
            <span class="top-stat-num" id="statProducts">0</span>
            <span class="top-stat-label">إجمالي المنتجات</span>
          </div>
        </div>
        <div class="top-stat-card">
          <div class="top-stat-icon">&#127918;</div>
          <div class="top-stat-info">
            <span class="top-stat-num" id="statGames">0</span>
            <span class="top-stat-label">ألعاب</span>
          </div>
        </div>
        <div class="top-stat-card">
          <div class="top-stat-icon">&#128187;</div>
          <div class="top-stat-info">
            <span class="top-stat-num" id="statSoftware">0</span>
            <span class="top-stat-label">برامج</span>
          </div>
        </div>
        <div class="top-stat-card">
          <div class="top-stat-icon">&#127873;</div>
          <div class="top-stat-info">
            <span class="top-stat-num" id="statGiftcards">0</span>
            <span class="top-stat-label">قسائم هدايا</span>
          </div>
        </div>
        <div class="top-stat-card">
          <div class="top-stat-icon">&#128276;</div>
          <div class="top-stat-info">
            <span class="top-stat-num" id="statSubscriptions">0</span>
            <span class="top-stat-label">اشتراكات</span>
          </div>
        </div>
        <div class="top-stat-card">
          <div class="top-stat-icon">&#128218;</div>
          <div class="top-stat-info">
            <span class="top-stat-num" id="statCourses">0</span>
            <span class="top-stat-label">دورات</span>
          </div>
        </div>
      </div>

      <!-- TABS NAVIGATION -->
      <div class="admin-tabs-nav">
        <button class="admin-tab-btn active" data-tab="products">
          <span>&#128230;</span> إدارة المنتجات
        </button>
        <button class="admin-tab-btn" data-tab="add-product">
          <span>&#10133;</span> إضافة منتج جديد
        </button>
      </div>

      <!-- PRODUCTS TAB -->
      <section class="admin-panel active" id="tab-products">
        <div class="panel-header">
          <h2>جميع المنتجات</h2>
          <div class="panel-actions">
            <input type="text" class="admin-search" id="adminSearch" placeholder="&#128269; بحث في المنتجات...">
            <button class="btn-add-new" id="btnAddNew">&#10133; منتج جديد</button>
          </div>
        </div>
        <div class="products-table-wrap">
          <table class="products-table" id="productsTable">
            <thead>
              <tr>
                <th>المنتج</th>
                <th>الفئة</th>
                <th>النوع</th>
                <th>السعر</th>
                <th>التقييم</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="productsTableBody"></tbody>
          </table>
        </div>
      </section>

      <!-- ADD/EDIT PRODUCT TAB -->
      <section class="admin-panel" id="tab-add-product">
        <div class="panel-header">
          <h2 id="formTitle">إضافة منتج جديد</h2>
        </div>
        <form class="product-form" id="productForm">
          <input type="hidden" id="editId" value="">

          <!-- Section: Basic Info -->
          <div class="form-section">
            <h3 class="form-section-title">&#128221; المعلومات الأساسية</h3>
            <div class="form-row">
              <div class="form-group">
                <label>اسم المنتج (عربي) <span class="required">*</span></label>
                <input type="text" id="pNameAr" required placeholder="اسم المنتج بالعربي">
              </div>
              <div class="form-group">
                <label>اسم المنتج (إنجليزي) <span class="required">*</span></label>
                <input type="text" id="pNameEn" required placeholder="Product name in English">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>الوصف (عربي) <span class="required">*</span></label>
                <textarea id="pDescAr" rows="2" required placeholder="وصف مختصر بالعربي"></textarea>
              </div>
              <div class="form-group">
                <label>الوصف (إنجليزي) <span class="required">*</span></label>
                <textarea id="pDescEn" rows="2" required placeholder="Short description in English"></textarea>
              </div>
            </div>
          </div>

          <!-- Section: Pricing & Media -->
          <div class="form-section">
            <h3 class="form-section-title">&#128176; السعر والوسائط</h3>
            <div class="form-row form-row-3">
              <div class="form-group">
                <label>السعر ($) <span class="required">*</span></label>
                <input type="number" id="pPrice" min="0" step="0.01" required placeholder="0.00">
              </div>
              <div class="form-group">
                <label>العلامة التجارية</label>
                <input type="text" id="pBrand" placeholder="Brand Name">
              </div>
              <div class="form-group">
                <label>رابط الصورة</label>
                <input type="text" id="pImage" placeholder="https://example.com/image.jpg">
              </div>
            </div>
          </div>

          <!-- Section: Classification -->
          <div class="form-section">
            <h3 class="form-section-title">&#128194; التصنيف</h3>
            <div class="form-row">
              <div class="form-group">
                <label>الفئة <span class="required">*</span></label>
                <select id="pCategory" required>
                  <option value="games">&#127918; ألعاب</option>
                  <option value="software">&#128187; برامج</option>
                  <option value="giftcards">&#127873; قسائم هدايا</option>
                  <option value="subscriptions">&#128276; اشتراكات</option>
                  <option value="courses">&#128218; دورات</option>
                </select>
              </div>
              <div class="form-group">
                <label>النوع <span class="required">*</span></label>
                <select id="pType" required>
                  <option value="product">منتج رقمي</option>
                  <option value="subscription">اشتراك</option>
                  <option value="service">خدمة</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Section: Ratings & Status -->
          <div class="form-section">
            <h3 class="form-section-title">&#11088; التقييم والحالة</h3>
            <div class="form-row form-row-3">
              <div class="form-group">
                <label>التقييم (0 - 5)</label>
                <input type="number" id="pRating" min="0" max="5" step="0.1" value="4.5">
              </div>
              <div class="form-group">
                <label>عدد المبيعات</label>
                <input type="number" id="pSales" min="0" value="0">
              </div>
              <div class="form-group form-group-checkboxes">
                <label class="checkbox-label">
                  <input type="checkbox" id="pFeatured"> منتج مميز
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" id="pOriginal" checked> أصلي 100%
                </label>
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-save" id="submitBtn">&#10003; إضافة المنتج</button>
            <button type="button" class="btn-cancel" id="cancelEdit" style="display:none">&#10005; إلغاء</button>
          </div>
        </form>
      </section>

    </div>
  </main>

  <!-- MOBILE BOTTOM NAV -->
  <nav class="admin-mobile-nav">
    <button class="admin-mobile-btn active" data-tab="products">
      <span>&#128230;</span>
      <span>المنتجات</span>
    </button>
    <button class="admin-mobile-btn" data-tab="add-product">
      <span>&#10133;</span>
      <span>إضافة</span>
    </button>
  </nav>

  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | ركان تول كيت</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/store.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="main-header">
    <div class="container header-layout">
      <a href="../index.html" class="logo">
        <span class="logo-icon">&#128296;</span>
        <span class="logo-text">ركان<span class="logo-highlight">تول كيت</span></span>
      </a>
      <nav class="main-nav" id="mainNav">
        <a href="../index.html">&#127968; الرئيسية</a>
        <a href="store.html">&#128722; المتجر</a>
        <a href="admin.html" class="active">&#128736; لوحة التحكم</a>
      </nav>
      <div class="header-actions">
        <button class="lang-toggle" id="langToggle">&#127760;</button>
        <button class="theme-toggle" id="themeToggle">&#9790;</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <div class="container admin-layout">

      <!-- SIDEBAR -->
      <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-header">
          <span class="admin-avatar">&#128100;</span>
          <span class="admin-name">المدير</span>
        </div>
        <nav class="admin-nav">
          <button class="admin-nav-btn active" data-tab="dashboard">
            <span>&#128202;</span> لوحة المعلومات
          </button>
          <button class="admin-nav-btn" data-tab="products">
            <span>&#128230;</span> إدارة المنتجات
          </button>
          <button class="admin-nav-btn" data-tab="add-product">
            <span>&#10133;</span> إضافة منتج
          </button>
        </nav>
      </aside>

      <!-- CONTENT -->
      <div class="admin-content">

        <!-- DASHBOARD TAB -->
        <section class="admin-tab active" id="tab-dashboard">
          <h2>مرحباً بك في لوحة التحكم</h2>

          <div class="stats-grid">
            <div class="admin-stat-card">
              <div class="admin-stat-icon">&#128230;</div>
              <div class="admin-stat-info">
                <span class="admin-stat-num" id="statProducts">0</span>
                <span class="admin-stat-label">منتج</span>
              </div>
            </div>
            <div class="admin-stat-card">
              <div class="admin-stat-icon">&#127918;</div>
              <div class="admin-stat-info">
                <span class="admin-stat-num" id="statGames">0</span>
                <span class="admin-stat-label">ألعاب</span>
              </div>
            </div>
            <div class="admin-stat-card">
              <div class="admin-stat-icon">&#128187;</div>
              <div class="admin-stat-info">
                <span class="admin-stat-num" id="statSoftware">0</span>
                <span class="admin-stat-label">برامج</span>
              </div>
            </div>
            <div class="admin-stat-card">
              <div class="admin-stat-icon">&#127873;</div>
              <div class="admin-stat-info">
                <span class="admin-stat-num" id="statGiftcards">0</span>
                <span class="admin-stat-label">قسائم هدايا</span>
              </div>
            </div>
            <div class="admin-stat-card">
              <div class="admin-stat-icon">&#128276;</div>
              <div class="admin-stat-info">
                <span class="admin-stat-num" id="statSubscriptions">0</span>
                <span class="admin-stat-label">اشتراكات</span>
              </div>
            </div>
            <div class="admin-stat-card">
              <div class="admin-stat-icon">&#128218;</div>
              <div class="admin-stat-info">
                <span class="admin-stat-num" id="statCourses">0</span>
                <span class="admin-stat-label">دورات</span>
              </div>
            </div>
          </div>
        </section>

        <!-- PRODUCTS TAB -->
        <section class="admin-tab" id="tab-products">
          <div class="tab-header">
            <h2>إدارة المنتجات</h2>
            <input type="text" class="admin-search" id="adminSearch" placeholder="بحث في المنتجات...">
          </div>
          <div class="products-table-wrap">
            <table class="products-table" id="productsTable">
              <thead>
                <tr>
                  <th>المنتج</th>
                  <th>الفئة</th>
                  <th>النوع</th>
                  <th>السعر</th>
                  <th>التقييم</th>
                  <th>إجراءات</th>
                </tr>
              </thead>
              <tbody id="productsTableBody"></tbody>
            </table>
          </div>
        </section>

        <!-- ADD/EDIT PRODUCT TAB -->
        <section class="admin-tab" id="tab-add-product">
          <h2 id="formTitle">إضافة منتج جديد</h2>
          <form class="product-form" id="productForm">
            <input type="hidden" id="editId" value="">

            <div class="form-row">
              <div class="form-group">
                <label>اسم المنتج (عربي)</label>
                <input type="text" id="pNameAr" required placeholder="اسم المنتج بالعربي">
              </div>
              <div class="form-group">
                <label>اسم المنتج (إنجليزي)</label>
                <input type="text" id="pNameEn" required placeholder="Product name in English">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>الوصف (عربي)</label>
                <textarea id="pDescAr" rows="2" required placeholder="وصف مختصر بالعربي"></textarea>
              </div>
              <div class="form-group">
                <label>الوصف (إنجليزي)</label>
                <textarea id="pDescEn" rows="2" required placeholder="Short description in English"></textarea>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>رابط الصورة</label>
                <input type="text" id="pImage" placeholder="https://example.com/image.jpg">
              </div>
              <div class="form-group">
                <label>السعر ($)</label>
                <input type="number" id="pPrice" min="0" step="0.01" required placeholder="0.00">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>الفئة</label>
                <select id="pCategory" required>
                  <option value="games">ألعاب</option>
                  <option value="software">برامج</option>
                  <option value="giftcards">قسائم هدايا</option>
                  <option value="subscriptions">اشتراكات</option>
                  <option value="courses">دورات</option>
                </select>
              </div>
              <div class="form-group">
                <label>النوع</label>
                <select id="pType" required>
                  <option value="product">منتج رقمي</option>
                  <option value="subscription">اشتراك</option>
                  <option value="service">خدمة</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>العلامة التجارية</label>
                <input type="text" id="pBrand" placeholder="Brand Name">
              </div>
              <div class="form-group">
                <label>التقييم (0-5)</label>
                <input type="number" id="pRating" min="0" max="5" step="0.1" value="4.5">
              </div>
              <div class="form-group">
                <label>عدد المبيعات</label>
                <input type="number" id="pSales" min="0" value="0">
              </div>
            </div>

            <div class="form-row">
              <label class="checkbox-label">
                <input type="checkbox" id="pFeatured"> منتج مميز
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="pOriginal" checked> أصلي 100%
              </label>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-save" id="submitBtn">إضافة المنتج</button>
              <button type="button" class="btn-cancel" id="cancelEdit" style="display:none">إلغاء التعديل</button>
            </div>
          </form>
        </section>

      </div>
    </div>
  </main>

  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>

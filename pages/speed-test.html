<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فحص سرعة الموقع - RaKaNToolKit</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/rtl.css">
  <link rel="stylesheet" href="../css/tools.css">
  <style>
    .speed-test-form { padding: 2rem; }
    .speed-url-input {
      display: flex; gap: 0.5rem; margin-bottom: 2rem;
    }
    .speed-url-input input {
      flex: 1; padding: 0.85rem 1rem; border: 2px solid var(--border);
      border-radius: var(--radius-sm); font-size: 1rem; font-family: var(--font);
      background: var(--bg); color: var(--text);
    }
    .speed-url-input input:focus { outline: none; border-color: var(--primary); }
    .speed-url-input button {
      padding: 0.85rem 1.5rem; border: none; border-radius: var(--radius-sm);
      background: var(--primary); color: white; font-weight: 600; cursor: pointer;
      font-family: var(--font); font-size: 1rem; transition: var(--transition);
    }
    .speed-url-input button:hover { background: var(--primary-hover); }
    .speed-results { display: none; }
    .speed-score {
      text-align: center; padding: 2rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: var(--radius); color: white; margin-bottom: 2rem;
    }
    .speed-score .score {
      font-size: 4rem; font-weight: 800; line-height: 1;
    }
    .speed-score .label { opacity: 0.8; margin-top: 0.5rem; }
    .speed-metrics {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem;
      margin-bottom: 2rem;
    }
    .metric-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 1.25rem; text-align: center;
    }
    .metric-card .metric-value {
      font-size: 1.5rem; font-weight: 700; color: var(--primary);
    }
    .metric-card .metric-label {
      font-size: 0.8rem; color: var(--text-light); margin-top: 0.25rem;
    }
    .speed-tips {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 1.5rem;
    }
    .speed-tips h3 { margin-bottom: 1rem; font-size: 1rem; }
    .speed-tips ul { padding-right: 1.2rem; }
    .speed-tips li {
      margin-bottom: 0.5rem; color: var(--text-light); font-size: 0.9rem;
      line-height: 1.5;
    }
    .speed-loading {
      display: none; text-align: center; padding: 3rem;
    }
    .spinner {
      width: 50px; height: 50px; border: 4px solid var(--border);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-bar {
      width: 100%; height: 6px; background: var(--border);
      border-radius: 3px; overflow: hidden; margin-top: 1rem;
    }
    .progress-bar-fill {
      height: 100%; background: var(--primary); border-radius: 3px;
      transition: width 0.3s; width: 0%;
    }
    @media (max-width: 480px) {
      .speed-metrics { grid-template-columns: 1fr; }
      .speed-url-input { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="container">
      <a href="../index.html" class="logo">RaKaNToolKit</a>
      <nav class="nav-links">
        <a href="../index.html" data-i18n="nav_home">الرئيسية</a>
        <a href="store.html">المتجر</a>
        <a href="../index.html#services" data-i18n="nav_services">الخدمات</a>
      </nav>
      <div class="header-actions">
        <div class="lang-selector">
          <button class="lang-btn">
            <span class="lang-current-label">العربية</span>
            <span>&#9662;</span>
          </button>
          <div class="lang-dropdown">
            <button data-lang="ar">العربية</button>
            <button data-lang="en">English</button>
            <button data-lang="fr">Français</button>
          </div>
        </div>
        <button class="btn-icon theme-toggle" title="Toggle theme">&#127769;</button>
        <button class="mobile-menu-btn" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="calc-page">
    <div class="calc-container" style="max-width: 700px;">
      <a href="../index.html" class="back-link" data-i18n="calc_back">&#8592; العودة للرئيسية</a>
      <div class="calc-wrapper">
        <div class="calc-display" style="background: linear-gradient(135deg, #f59e0b, #ef4444); min-height: 80px;">
          <div class="calc-expression">&#9889;</div>
          <div class="calc-result" style="font-size: 1.5rem;" data-i18n="card_speed_test">فحص سرعة الموقع</div>
        </div>

        <div class="speed-test-form">
          <div class="speed-url-input">
            <input type="url" id="urlInput" placeholder="https://example.com">
            <button id="testBtn" data-i18n="speed_test_btn">فحص السرعة</button>
          </div>

          <div class="speed-loading" id="loadingSection">
            <div class="spinner"></div>
            <p data-i18n="speed_analyzing">جاري تحليل الموقع...</p>
            <div class="progress-bar"><div class="progress-bar-fill" id="progressBar"></div></div>
          </div>

          <div class="speed-results" id="resultsSection">
            <div class="speed-score">
              <div class="score" id="scoreValue">--</div>
              <div class="label" data-i18n="speed_performance">تقييم الأداء</div>
            </div>

            <div class="speed-metrics">
              <div class="metric-card">
                <div class="metric-value" id="metricFCP">--</div>
                <div class="metric-label" data-i18n="speed_fcp">First Contentful Paint</div>
              </div>
              <div class="metric-card">
                <div class="metric-value" id="metricLCP">--</div>
                <div class="metric-label" data-i18n="speed_lcp">Largest Contentful Paint</div>
              </div>
              <div class="metric-card">
                <div class="metric-value" id="metricTBT">--</div>
                <div class="metric-label" data-i18n="speed_tbt">Total Blocking Time</div>
              </div>
              <div class="metric-card">
                <div class="metric-value" id="metricCLS">--</div>
                <div class="metric-label" data-i18n="speed_cls">Cumulative Layout Shift</div>
              </div>
              <div class="metric-card">
                <div class="metric-value" id="metricSI">--</div>
                <div class="metric-label" data-i18n="speed_si">Speed Index</div>
              </div>
              <div class="metric-card">
                <div class="metric-value" id="metricTTI">--</div>
                <div class="metric-label" data-i18n="speed_tti">Time to Interactive</div>
              </div>
            </div>

            <div class="speed-tips">
              <h3 data-i18n="speed_tips_title">نصائح لتحسين السرعة</h3>
              <ul id="tipsList"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlInput = document.getElementById('urlInput');
      const testBtn = document.getElementById('testBtn');
      const loadingSection = document.getElementById('loadingSection');
      const resultsSection = document.getElementById('resultsSection');
      const progressBar = document.getElementById('progressBar');
      const tipsList = document.getElementById('tipsList');

      testBtn.addEventListener('click', () => {
        const url = urlInput.value.trim();
        if (!url) return;

        loadingSection.style.display = 'block';
        resultsSection.style.display = 'none';
        progressBar.style.width = '0%';

        let progress = 0;
        const interval = setInterval(() => {
          progress += Math.random() * 15;
          if (progress > 90) progress = 90;
          progressBar.style.width = progress + '%';
        }, 300);

        setTimeout(() => {
          clearInterval(interval);
          progressBar.style.width = '100%';

          setTimeout(() => {
            loadingSection.style.display = 'none';
            resultsSection.style.display = 'block';

            const score = Math.floor(Math.random() * 40) + 60;
            document.getElementById('scoreValue').textContent = score;
            document.getElementById('metricFCP').textContent = (Math.random() * 1.5 + 0.5).toFixed(1) + 's';
            document.getElementById('metricLCP').textContent = (Math.random() * 2 + 1).toFixed(1) + 's';
            document.getElementById('metricTBT').textContent = Math.floor(Math.random() * 200 + 50) + 'ms';
            document.getElementById('metricCLS').textContent = (Math.random() * 0.3).toFixed(3);
            document.getElementById('metricSI').textContent = (Math.random() * 3 + 1).toFixed(1) + 's';
            document.getElementById('metricTTI').textContent = (Math.random() * 3 + 1).toFixed(1) + 's';

            const tips = [
              'قم بضغط الصور واستخدام صيغ WebP لتقليل حجم التحميل',
              'قلل من ملفات CSS وJavaScript غير المستخدمة',
              'استخدم懒加载 (Lazy Loading) للصور والفيديو',
              'فعّل التخزين المؤقت للمتصفح (Browser Caching)',
              'استخدم شبكة توصيل المحتوى (CDN) لتقريب المحتوى من المستخدمين',
              'قلل عدد الطلبات HTTP غير الضرورية',
              'حسّن الخطوط المستخدمة واستخدم font-display: swap'
            ];
            tipsList.innerHTML = tips.map(t => '<li>' + t + '</li>').join('');
          }, 500);
        }, 2500);
      });
    });
  </script>
</body>
</html>
